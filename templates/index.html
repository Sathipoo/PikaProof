<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PikaProof - Internship Certificate</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
<div class="container">
    <h1 class="mb-4">PikaProof</h1>

    <ul class="nav nav-tabs" id="inputTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="form-tab" data-bs-toggle="tab" data-bs-target="#form" type="button" role="tab">Form View</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="json-tab" data-bs-toggle="tab" data-bs-target="#json" type="button" role="tab">JSON Input</button>
        </li>
    </ul>
    <div class="tab-content mt-3" id="inputTabsContent">
        <div class="tab-pane fade show active" id="form" role="tabpanel">
            <form method="POST" action="{{ url_for('generate') }}">
                <input type="hidden" name="input_type" value="form">
                <div class="mb-3"><label class="form-label">Name<input class="form-control" name="name" required></label></div>
                <div class="mb-3"><label class="form-label">Title<input class="form-control" name="title" required></label></div>
                <div class="row mb-3">
                    <div class="col"><label class="form-label">Start Date<input type="date" class="form-control" name="start_date" required></label></div>
                    <div class="col"><label class="form-label">End Date<input type="date" class="form-control" name="end_date" required></label></div>
                </div>
                <div class="mb-3"><label class="form-label">Responsibilities<textarea class="form-control" name="responsibilities" rows="4" placeholder="One per line"></textarea></label></div>
                <div class="mb-3"><label class="form-label">Issuer Name<input class="form-control" name="issuer_name" required></label></div>
                <div class="mb-3"><label class="form-label">Issuer Title<input class="form-control" name="issuer_title" required></label></div>
                <button type="submit" class="btn btn-primary">Generate</button>
            </form>
        </div>
        <div class="tab-pane fade" id="json" role="tabpanel">
            <form method="POST" action="{{ url_for('generate') }}">
                <input type="hidden" name="input_type" value="json">
                <div class="mb-3">
                    <textarea name="json_data" class="form-control" rows="10" placeholder="{\n  &quot;name&quot;: &quot;Janith Ram&quot;,\n  ...\n}"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Generate</button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
